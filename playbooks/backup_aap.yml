---
- name: Backup Ansible Automation Platform
  hosts: all
  become: true
  gather_facts: true

  vars:
    backup_dir: "/opt/aap-backups"
    backup_date: "{{ ansible_date_time.iso8601_basic_short }}"
    retention_days: 7

  tasks:
    - name: Create backup root directory
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0750'

    - name: Run backup tasks
      ansible.builtin.import_tasks: tasks/backup_aap.yml
