---
- name: Upgrade Ansible Automation Platform
  hosts: all
  become: true
  gather_facts: true

  vars:
    current_version: "2.4"
    target_version: "2.5"  # Set desired target version
    backup_before_upgrade: true
    upgrade_timeout: 3600  # 1 hour
    installer_dir: "/usr/share/ansible-automation-platform-installer"
    custom_inventory_dir: "/opt/aap-installer"

  vars_prompt:
    - name: confirm_upgrade
      prompt: "Are you sure you want to upgrade AAP from {{ current_version }} to {{ target_version }}? (yes/no)"
      private: false
    - name: rh_username
      prompt: "Enter your Red Hat Customer Portal Username"
      private: false
    - name: rh_password
      prompt: "Enter your Red Hat Customer Portal Password"
      private: true

  tasks:
    - name: Validate upgrade confirmation
      ansible.builtin.assert:
        that:
          - confirm_upgrade | lower == "yes"
        fail_msg: "Upgrade not confirmed. Please run playbook again and confirm with 'yes'"
        quiet: true

    # A single timestamp for the whole run, so the backup that is taken and the
    # backup the rollback path restores from can never diverge.
    - name: Set backup location facts
      ansible.builtin.set_fact:
        upgrade_stamp: "{{ ansible_date_time.iso8601_basic_short }}"
        pre_upgrade_backup_root: "/opt/aap-backup-pre-upgrade-{{ ansible_date_time.iso8601_basic_short }}"

    - name: Gather service facts
      ansible.builtin.service_facts:

    # Informational only: a missing awx-manage is expected on a broken or
    # partially installed host, so this probe must not fail the play.
    - name: Check current AAP version
      ansible.builtin.command: awx-manage --version
      register: current_aap_version
      changed_when: false
      failed_when: false

    - name: Display current version
      ansible.builtin.debug:
        msg: "Current AAP version: {{ current_aap_version.stdout | default('Unknown') | trim | default('Unknown', true) }}"

    - name: Pre-upgrade backup
      when: backup_before_upgrade | bool
      block:
        - name: Create pre-upgrade backup directory
          ansible.builtin.file:
            path: "{{ pre_upgrade_backup_root }}"
            state: directory
            mode: '0750'

        - name: Run comprehensive backup
          ansible.builtin.include_tasks: tasks/backup_aap.yml
          vars:
            backup_dir: "{{ pre_upgrade_backup_root }}"
            backup_date: "{{ upgrade_stamp }}"
            retention_days: 3650

        - name: Backup inventory file
          ansible.builtin.copy:
            src: "{{ custom_inventory_dir }}/inventory"
            dest: "{{ pre_upgrade_backup_root }}/{{ upgrade_stamp }}/inventory_backup"
            remote_src: true
            mode: '0600'

      rescue:
        - name: Fail because no usable pre-upgrade backup exists
          ansible.builtin.fail:
            msg: |
              Pre-upgrade backup failed at task '{{ ansible_failed_task.name }}', so the upgrade
              has been aborted - upgrading without a restorable backup leaves no rollback path.
              Error: {{ ansible_failed_result.msg | default(ansible_failed_result) }}
              Re-run with -e backup_before_upgrade=false only if you accept losing the rollback.

    - name: Pre-upgrade health check
      block:
        - name: Check AAP services status
          ansible.builtin.systemd:
            name: "{{ item }}"
            state: started
          loop:
            - postgresql
            - awx
          register: pre_upgrade_services

        - name: Verify AAP API
          ansible.builtin.uri:
            url: "https://{{ ansible_default_ipv4.address | default(ansible_all_ipv4_addresses[0]) }}/api/v2/ping/"
            method: GET
            validate_certs: false
          register: pre_upgrade_api

        - name: Display pre-upgrade status
          ansible.builtin.debug:
            msg: "Pre-upgrade health check: Services OK, API: {{ 'OK' if pre_upgrade_api.status == 200 else 'FAILED' }}"

    - name: Upgrade AAP
      block:
        # receptor is not installed in every topology, so absent units are
        # skipped explicitly instead of ignoring every systemd error.
        - name: Stop AAP services before upgrade
          ansible.builtin.systemd:
            name: "{{ item }}"
            state: stopped
          loop:
            - awx
            - receptor
          when: item ~ '.service' in ansible_facts.services

        - name: Update subscription repositories
          ansible.builtin.command:
            cmd: "subscription-manager repos --enable=ansible-automation-platform-{{ target_version }}-for-rhel-9-x86_64-rpms"
          register: repo_update
          changed_when: repo_update.rc == 0

        - name: Update AAP installer package
          ansible.builtin.dnf:
            name: ansible-automation-platform-installer
            state: latest  # noqa package-latest - an upgrade run must pick up the newest installer
          register: installer_update

        - name: Update inventory file for new version
          ansible.builtin.copy:
            content: |
              [automationcontroller]
              {{ ansible_default_ipv4.address | default(ansible_all_ipv4_addresses[0]) }} ansible_connection=local

              [automationhub]

              [execution_nodes]

              [database]
              {{ ansible_default_ipv4.address | default(ansible_all_ipv4_addresses[0]) }} ansible_connection=local

              [all:vars]
              # Platform Version
              automation_platform_version='{{ target_version }}'

              admin_password='{{ vault_aap_admin_password | default(lookup('env', 'AAP_ADMIN_PASSWORD'), true) }}'
              registry_username='{{ rh_username }}'
              registry_password='{{ rh_password }}'

              pg_sslmode='prefer'
              pg_host='{{ ansible_default_ipv4.address | default(ansible_all_ipv4_addresses[0]) }}'
              pg_port='5432'
              pg_database='awx'
              pg_username='awx'
              pg_password='{{ vault_aap_db_password | default(lookup('env', 'AAP_DB_PASSWORD'), true) }}'

              controller_web_port=443
            dest: "{{ custom_inventory_dir }}/inventory-upgrade"
            mode: '0600'

        - name: Run AAP upgrade
          ansible.builtin.command: "./setup.sh -i {{ custom_inventory_dir }}/inventory-upgrade"
          args:
            chdir: "{{ installer_dir }}"
          register: upgrade_result
          changed_when: true
          async: "{{ upgrade_timeout }}"
          poll: 30

        - name: Start AAP services
          ansible.builtin.systemd:
            name: "{{ item }}"
            state: started
            enabled: true
          loop:
            - postgresql
            - awx
            - receptor
          when: item ~ '.service' in ansible_facts.services

        - name: Wait for AAP services to be ready
          ansible.builtin.uri:
            url: "https://{{ ansible_default_ipv4.address | default(ansible_all_ipv4_addresses[0]) }}/api/v2/ping/"
            method: GET
            validate_certs: false
            return_content: true
          register: post_upgrade_api
          until: post_upgrade_api.status == 200
          retries: 30
          delay: 10

        - name: Verify new version
          ansible.builtin.command: awx-manage --version
          register: new_aap_version
          changed_when: false

        - name: Display upgrade completion
          ansible.builtin.debug:
            msg: |
              AAP Upgrade completed successfully!

              Previous version: {{ current_version }}
              New version: {{ new_aap_version.stdout | trim }}

              Post-upgrade tasks:
              1. Verify AAP console functionality
              2. Test existing job templates
              3. Review release notes for breaking changes
              4. Update custom execution environments if needed
              5. Verify integrations and credentials

        - name: Promote the upgrade inventory file
          ansible.builtin.copy:
            src: "{{ custom_inventory_dir }}/inventory-upgrade"
            dest: "{{ custom_inventory_dir }}/inventory"
            remote_src: true
            mode: '0600'

        - name: Save upgrade manifest
          ansible.builtin.copy:
            content: |
              AAP Upgrade Manifest
              =====================
              Upgrade Date: {{ ansible_date_time.iso8601 }}
              Previous Version: {{ current_version }}
              New Version: {{ new_aap_version.stdout | trim }}
              Host: {{ ansible_hostname }}

              Upgrade Status: Success
              Backup Location: {{ pre_upgrade_backup_root }}/{{ upgrade_stamp }}

              Rollback Instructions:
              1. Stop AAP services
              2. Restore from backup:
                 ansible-playbook restore_aap.yml \
                   -e backup_dir={{ pre_upgrade_backup_root }} \
                   -e backup_date={{ upgrade_stamp }} \
                   -e restore_method=full
              3. Verify system functionality

              Post-Upgrade Checklist:
              - [ ] Verify AAP console access
              - [ ] Test job execution
              - [ ] Check execution environments
              - [ ] Review user permissions
              - [ ] Verify integrations
            dest: "{{ custom_inventory_dir }}/UPGRADE_MANIFEST.txt"
            mode: '0644'

      rescue:
        - name: Record the upgrade failure
          ansible.builtin.set_fact:
            upgrade_failed_task: "{{ ansible_failed_task.name }}"
            upgrade_failed_result: "{{ ansible_failed_result.msg | default(ansible_failed_result) }}"

        - name: Report the upgrade failure
          ansible.builtin.debug:
            msg: "Upgrade failed at task '{{ upgrade_failed_task }}': {{ upgrade_failed_result }}"

        - name: Restore from the pre-upgrade backup
          ansible.builtin.include_tasks: tasks/restore_aap.yml
          vars:
            backup_dir: "{{ pre_upgrade_backup_root }}"
            backup_date: "{{ upgrade_stamp }}"
            restore_method: "full"
            restore_require_confirmation: false
          when: backup_before_upgrade | bool

        - name: Fail the play after handling the upgrade failure
          ansible.builtin.fail:
            msg: |
              AAP upgrade to {{ target_version }} FAILED at task '{{ upgrade_failed_task }}'.
              {{ 'A rollback from ' ~ pre_upgrade_backup_root ~ '/' ~ upgrade_stamp ~ ' was attempted.'
                 if backup_before_upgrade | bool
                 else 'No pre-upgrade backup was taken, so no rollback was attempted.' }}
              Error: {{ upgrade_failed_result }}
