---
- name: Upgrade Ansible Automation Platform
  hosts: all
  become: true
  gather_facts: true

  vars_files:
    - vars/aap_common.yml

  vars:
    current_version: "2.4"
    target_version: "2.5"  # Set desired target version
    backup_before_upgrade: true
    upgrade_timeout: 3600  # 1 hour

  vars_prompt:
    - name: confirm_upgrade
      prompt: "Are you sure you want to upgrade AAP from {{ current_version }} to {{ target_version }}? (yes/no)"
      private: false
    - name: rh_username
      prompt: "Enter your Red Hat Customer Portal Username"
      private: false
    - name: rh_password
      prompt: "Enter your Red Hat Customer Portal Password"
      private: true

  tasks:
    - name: Validate upgrade confirmation
      assert:
        that:
          - confirm_upgrade | lower == "yes"
        fail_msg: "Upgrade not confirmed. Please run playbook again and confirm with 'yes'"
        quiet: true

    - name: Check current AAP version
      shell: |
        awx-manage --version
      register: current_aap_version
      ignore_errors: true

    - name: Display current version
      debug:
        msg: "Current AAP version: {{ current_aap_version.stdout | default('Unknown') }}"

    - name: Set pre-upgrade backup location
      set_fact:
        pre_upgrade_backup_dir: "/opt/aap-backup-pre-upgrade-{{ ansible_date_time.iso8601_basic_short }}"

    - name: Pre-upgrade backup
      block:
        - name: Create pre-upgrade backup directory
          file:
            path: "{{ pre_upgrade_backup_dir }}"
            state: directory
            mode: '0755'

        - name: Run comprehensive backup
          include_tasks: tasks/backup_aap.yml
          vars:
            backup_dir: "{{ pre_upgrade_backup_dir }}"

        - name: Backup inventory file
          copy:
            src: "{{ aap_custom_inventory_dir }}/inventory"
            dest: "{{ pre_upgrade_backup_dir }}/inventory_backup"
            remote_src: true
            mode: '0600'
      when: backup_before_upgrade

    - name: Pre-upgrade health check
      block:
        - name: Check AAP services status
          include_tasks: tasks/aap_services.yml

        - name: Verify AAP API
          uri:
            url: "{{ aap_api_ping_url }}"
            method: GET
            validate_certs: false
          register: pre_upgrade_api

        - name: Display pre-upgrade status
          debug:
            msg: "Pre-upgrade health check: Services OK, API: {{ 'OK' if pre_upgrade_api.status == 200 else 'FAILED' }}"

    - name: Stop AAP services before upgrade
      include_tasks: tasks/aap_services.yml
      vars:
        aap_services:
          - awx
          - receptor
        aap_service_state: stopped
        aap_service_ignore_errors: true

    - name: Update subscription repositories
      command: "subscription-manager repos --enable={{ aap_repo_name }}"
      register: repo_update
      changed_when: repo_update.rc == 0
      vars:
        aap_repo_version: "{{ target_version }}"

    - name: Update AAP installer package
      dnf:
        name: ansible-automation-platform-installer
        state: latest

    - name: Update inventory file for new version
      template:
        src: templates/aap_inventory.j2
        dest: "{{ aap_custom_inventory_dir }}/inventory-upgrade"
        mode: '0600'
      vars:
        aap_inventory_version: "{{ target_version }}"
        aap_inventory_admin_password: "{{ vault_aap_admin_password | default(lookup('env', 'AAP_ADMIN_PASSWORD')) | default('CHANGE_ME') }}"
        aap_inventory_db_password: "{{ vault_aap_db_password | default(lookup('env', 'AAP_DB_PASSWORD')) | default('CHANGE_ME') }}"
        aap_inventory_registry_username: "{{ rh_username }}"
        aap_inventory_registry_password: "{{ rh_password }}"

    - name: Run AAP upgrade
      command: "./setup.sh -i {{ aap_custom_inventory_dir }}/inventory-upgrade"
      args:
        chdir: "{{ aap_installer_dir }}"
      register: upgrade_result
      async: "{{ upgrade_timeout }}"
      poll: 30
      timeout: "{{ upgrade_timeout }}"

    - name: Check upgrade result
      debug:
        msg: "Upgrade completed with return code: {{ upgrade_result.rc }}"

    - name: Start AAP services
      include_tasks: tasks/aap_services.yml
      vars:
        aap_services: "{{ aap_runtime_services }}"
        aap_service_enabled: true

    - name: Wait for AAP services to be ready
      include_tasks: tasks/wait_for_aap.yml

    - name: Verify new version
      shell: |
        awx-manage --version
      register: new_aap_version

    - name: Display upgrade completion
      debug:
        msg: |
          🎉 AAP Upgrade completed successfully!

          Previous version: {{ current_version }}
          New version: {{ new_aap_version.stdout }}

          Post-upgrade tasks:
          1. Verify AAP console functionality
          2. Test existing job templates
          3. Review release notes for breaking changes
          4. Update custom execution environments if needed
          5. Verify integrations and credentials

    - name: Clean up old inventory file
      copy:
        src: "{{ aap_custom_inventory_dir }}/inventory-upgrade"
        dest: "{{ aap_custom_inventory_dir }}/inventory"
        remote_src: true
        mode: '0600'

    - name: Save upgrade manifest
      copy:
        content: |
          AAP Upgrade Manifest
          =====================
          Upgrade Date: {{ ansible_date_time.iso8601 }}
          Previous Version: {{ current_version }}
          New Version: {{ new_aap_version.stdout }}
          Host: {{ ansible_hostname }}

          Upgrade Status: Success
          Backup Location: {{ pre_upgrade_backup_dir }}

          Rollback Instructions:
          1. Stop AAP services
          2. Restore from backup: ansible-playbook restore_aap.yml -e "backup_dir={{ pre_upgrade_backup_dir }} backup_date={{ ansible_date_time.iso8601_basic_short }}"
          3. Verify system functionality

          Post-Upgrade Checklist:
          - [ ] Verify AAP console access
          - [ ] Test job execution
          - [ ] Check execution environments
          - [ ] Review user permissions
          - [ ] Verify integrations
        dest: "{{ aap_custom_inventory_dir }}/UPGRADE_MANIFEST.txt"
        mode: '0644'

    - name: Error handling - rollback on failure
      block:
        - name: Restore from backup if upgrade failed
          include_tasks: tasks/restore_aap.yml
          vars:
            backup_dir: "{{ pre_upgrade_backup_dir }}"
            backup_date: "{{ ansible_date_time.iso8601_basic_short }}"
            restore_method: "full"

        - name: Alert on upgrade failure
          debug:
            msg: "Upgrade failed. Rollback completed from backup."
      when: upgrade_result.rc != 0
