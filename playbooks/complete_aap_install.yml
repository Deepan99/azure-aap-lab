---
- name: Complete AAP Installation Automation
  hosts: all
  become: true
  gather_facts: true

  vars:
    aap_version: "2.4"
    installer_dir: "/usr/share/ansible-automation-platform-installer"
    custom_inventory_dir: "/opt/aap-installer"
    installation_timeout: 1800  # 30 minutes
    poll_interval: 30           # Check every 30 seconds

  vars_prompt:
    - name: rh_username
      prompt: "Enter your Red Hat Customer Portal Username"
      private: false
    - name: rh_password
      prompt: "Enter your Red Hat Customer Portal Password"
      private: true
    - name: aap_admin_password
      prompt: "Enter AAP Admin Password (min 12 chars, mix of letters, numbers, symbols)"
      private: true
      confirm: true
    - name: aap_db_password
      prompt: "Enter AAP Database Password (min 12 chars, mix of letters, numbers, symbols)"
      private: true
      confirm: true

  tasks:
    - name: Validate password complexity
      assert:
        that:
          - aap_admin_password | length >= 12
          - aap_db_password | length >= 12
        fail_msg: "Passwords must be at least 12 characters long"
        quiet: true
      ignore_errors: true

    - name: Alert on password validation failure
      debug:
        msg: "WARNING: Passwords do not meet complexity requirements. Please use stronger passwords."
      when: 
        - aap_admin_password | length < 12 or aap_db_password | length < 12

    - name: Force password complexity validation
      assert:
        that:
          - aap_admin_password | length >= 12
          - aap_db_password | length >= 12
        fail_msg: "Installation aborted. Passwords must be at least 12 characters long for security."
        quiet: true
      when: 
        - aap_admin_password | length < 12 or aap_db_password | length < 12

    - name: Validate password contains mixed characters
      assert:
        that:
          - aap_admin_password | regex_search('[A-Z]')
          - aap_admin_password | regex_search('[a-z]')
          - aap_admin_password | regex_search('[0-9]')
          - aap_admin_password | regex_search('[^A-Za-z0-9]')
        fail_msg: "Admin password must contain uppercase, lowercase, numbers, and special characters"
        quiet: true

    - name: Pre-flight system check
      block:
        - name: Check system resources
          shell: |
            echo "CPU: $(nproc)"
            echo "Memory: $(free -g | awk '/^Mem:/{print $2}')GB"
            echo "Disk: $(df -h / | awk 'NR==2{print $4}' | sed 's/G//')GB available"
          register: system_resources

        - name: Validate system meets minimum requirements
          assert:
            that:
              - ansible_facts['processor_vcpus'] >= 4
              - ansible_facts['memtotal_mb'] >= 16384
              - ansible_mounts | selectattr('mount', 'equalto', '/') | map(attribute='size_available') | first > 50 * 1024 * 1024 * 1024
            fail_msg: "System does not meet minimum requirements (4 vCPUs, 16GB RAM, 50GB disk)"
            quiet: true

        - name: Display system resources
          debug:
            msg: "{{ system_resources.stdout_lines }}"

    - name: Ensure AAP installer is present
      dnf:
        name: ansible-automation-platform-installer
        state: present

    - name: Create custom inventory directory
      file:
        path: "{{ custom_inventory_dir }}"
        state: directory
        mode: '0755'

    - name: Generate AAP installer inventory
      copy:
        content: |
          [automationcontroller]
          {{ ansible_default_ipv4.address | default(ansible_all_ipv4_addresses[0]) }} ansible_connection=local

          [automationhub]

          [execution_nodes]

          [database]
          {{ ansible_default_ipv4.address | default(ansible_all_ipv4_addresses[0]) }} ansible_connection=local

          [all:vars]
          # Platform Version
          automation_platform_version='{{ aap_version }}'

          # Web Admin UI Credentials
          admin_password='{{ aap_admin_password }}'

          # Red Hat Registry Credentials (required to pull EE containers)
          registry_username='{{ rh_username }}'
          registry_password='{{ rh_password }}'

          # Local PostgreSQL Database Configurations
          pg_sslmode='prefer'
          pg_host='{{ ansible_default_ipv4.address | default(ansible_all_ipv4_addresses[0]) }}'
          pg_port='5432'
          pg_database='awx'
          pg_username='awx'
          pg_password='{{ aap_db_password }}'

          # UI Web Port
          controller_web_port=443

          # Additional configuration
          postgresql_data_dir=/var/lib/pgsql/data
          pg_backup_dir=/var/lib/pgbackups
        dest: "{{ custom_inventory_dir }}/inventory"
        mode: '0600'

    - name: Backup existing installation if present
      block:
        - name: Check if AAP is already installed
          stat:
            path: /etc/tower
          register: existing_install

        - name: Create backup directory
          file:
            path: /opt/aap-backup-pre-{{ ansible_date_time.epoch }}
            state: directory
          when: existing_install.stat.exists

        - name: Backup existing configuration
          shell: |
            tar -czf /opt/aap-backup-pre-{{ ansible_date_time.epoch }}/aap_backup.tar.gz /etc/tower /var/lib/awx
          changed_when: true
          when: existing_install.stat.exists
          ignore_errors: true
      when: true

    - name: Run AAP installer
      command: "./setup.sh -i {{ custom_inventory_dir }}/inventory"
      args:
        chdir: "{{ installer_dir }}"
      register: install_result
      async: "{{ installation_timeout }}"
      poll: "{{ poll_interval }}"
      timeout: "{{ installation_timeout }}"

    - name: Check installation result
      debug:
        msg: "Installation completed with return code: {{ install_result.rc }}"

    - name: Verify AAP services are running
      systemd:
        name: "{{ item }}"
        state: started
      loop:
        - postgresql
        - awx
      register: service_status

    - name: Wait for AAP API to be ready
      uri:
        url: "https://{{ ansible_default_ipv4.address | default(ansible_all_ipv4_addresses[0]) }}/api/v2/ping/"
        method: GET
        validate_certs: false
        return_content: yes
      register: aap_ping
      until: aap_ping.status == 200
      retries: 30
      delay: 10
      timeout: 300

    - name: Verify AAP web interface
      uri:
        url: "https://{{ ansible_default_ipv4.address | default(ansible_all_ipv4_addresses[0]) }}/"
        method: GET
        validate_certs: false
        return_content: yes
      register: aap_web
      until: aap_web.status == 200
      retries: 10
      delay: 10
      timeout: 120

    - name: Test AAP admin login
      uri:
        url: "https://{{ ansible_default_ipv4.address | default(ansible_all_ipv4_addresses[0]) }}/api/v2/me/"
        method: GET
        user: "admin"
        password: "{{ aap_admin_password }}"
        validate_certs: false
        return_content: yes
      register: admin_login
      until: admin_login.status == 200
      retries: 5
      delay: 5
      timeout: 60

    - name: Display installation success message
      debug:
        msg: |
          🎉 AAP Installation completed successfully!
          
          Access the AAP console at: https://{{ ansible_default_ipv4.address | default(ansible_all_ipv4_addresses[0]) }}
          
          Login credentials:
          Username: admin
          Password: <your_admin_password>
          
          Next steps:
          1. Access the web console
          2. Activate your Red Hat subscription
          3. Configure automation hub repositories
          4. Set up additional security (SSL certificates, etc.)
          
          Post-installation recommendations:
          - Run setup_monitoring.yml to enable monitoring
          - Configure backup_aap.yml for regular backups
          - Review security settings in the AAP console

    - name: Save installation manifest
      copy:
        content: |
          AAP Installation Manifest
          ==========================
          Installation Date: {{ ansible_date_time.iso8601 }}
          AAP Version: {{ aap_version }}
          Host: {{ ansible_hostname }}
          IP Address: {{ ansible_default_ipv4.address | default(ansible_all_ipv4_addresses[0]) }}
          
          System Information:
          CPU: {{ ansible_facts['processor_vcpus'] }} cores
          Memory: {{ ansible_facts['memtotal_mb'] }} MB
          Disk: {{ ansible_mounts | selectattr('mount', 'equalto', '/') | map(attribute='size_total') | first / 1024 / 1024 / 1024 }} GB
          
          Installation Status: Success
          Installer Directory: {{ installer_dir }}
          Inventory File: {{ custom_inventory_dir }}/inventory
          
          Important Files:
          - Inventory: {{ custom_inventory_dir }}/inventory
          - Logs: /var/log/tower/
          - Config: /etc/tower/
          
          Next Steps:
          1. Access web console
          2. Activate subscription
          3. Setup monitoring
          4. Configure backups
        dest: "{{ custom_inventory_dir }}/INSTALLATION_MANIFEST.txt"
        mode: '0644'

    - name: Display installation manifest location
      debug:
        msg: "Installation manifest saved to: {{ custom_inventory_dir }}/INSTALLATION_MANIFEST.txt"