---
# Full AAP backup: database, configuration, custom content and settings.
# Included by backup_aap.yml and by upgrade_aap.yml (pre-upgrade backup).
#
# Optional variables:
#   backup_dir     - root backup directory (defaults to aap_backup_dir)
#   backup_date    - backup subdirectory name (defaults to the current timestamp)
#   retention_days - age at which old backup directories are pruned

- name: Validate backup date format
  assert:
    that:
      - backup_date | default(ansible_date_time.iso8601_basic_short) is match('^[0-9]{8}T[0-9]{6}$')
    fail_msg: "backup_date must be a basic-short ISO8601 timestamp such as '20260814T120000'."
    quiet: true

- name: Resolve backup target directory
  set_fact:
    aap_backup_path: "{{ backup_dir | default(aap_backup_dir) }}/{{ backup_date | default(ansible_date_time.iso8601_basic_short) }}"

# Backups contain the AAP database and exported settings, so they must not be
# world-readable. The awx group needs write access for the database dump.
- name: Create backup directory
  file:
    path: "{{ backup_dir | default(aap_backup_dir) }}"
    state: directory
    owner: root
    group: awx
    mode: '0770'

- name: Create timestamped backup subdirectory
  file:
    path: "{{ aap_backup_path }}"
    state: directory
    owner: root
    group: awx
    mode: '0770'

- name: Backup PostgreSQL database
  postgresql_db:
    name: awx
    state: dump
    target: "{{ aap_backup_path }}/awx_db_backup.sql"
  become_user: awx
  when: ansible_facts['services']['postgresql.service'] is defined
  register: db_backup
  ignore_errors: true

- name: Alert on database backup failure
  debug:
    msg: "WARNING: Database backup failed. Proceeding with other backup components."
  when: db_backup is failed

- name: Backup AAP configuration files
  archive:
    path:
      - /etc/tower/
      - /var/lib/awx/
      - /etc/ansible-automation-platform/
    dest: "{{ aap_backup_path }}/aap_config_backup.tar.gz"
    mode: '0600'
  register: config_backup
  ignore_errors: true

- name: Alert on configuration backup failure
  debug:
    msg: "WARNING: Configuration backup failed. Some files may not be included."
  when: config_backup is failed

- name: Backup custom EE images and projects
  archive:
    path:
      - /var/lib/awx/projects/
      - /var/lib/awx/ee/
    dest: "{{ aap_backup_path }}/aap_custom_content.tar.gz"
    mode: '0600'

- name: Backup secrets
  shell: |
    umask 077
    awx-manage export_settings --indent 2 > "{{ aap_backup_path }}/aap_settings.json"
  args:
    chdir: /var/lib/awx
  when: ansible_facts['services']['awx.service'] is defined
  no_log: true

- name: Restrict permissions on exported settings and database dump
  file:
    path: "{{ aap_backup_path }}/{{ item }}"
    owner: root
    group: awx
    mode: '0640'
  loop:
    - aap_settings.json
    - awx_db_backup.sql
  failed_when: false

- name: Generate backup manifest
  copy:
    content: |
      AAP Backup Manifest
      ===================
      Date: {{ backup_date | default(ansible_date_time.iso8601_basic_short) }}
      Host: {{ ansible_hostname }}
      AAP Version: {{ ansible_facts['packages']['ansible-automation-platform-installer'].version | default('unknown') }}

      Backup Contents:
      - Database: {{ aap_backup_path }}/awx_db_backup.sql
      - Configuration: {{ aap_backup_path }}/aap_config_backup.tar.gz
      - Custom Content: {{ aap_backup_path }}/aap_custom_content.tar.gz
      - Settings: {{ aap_backup_path }}/aap_settings.json

      Restoration Instructions:
      See restore_aap.yml playbook
    dest: "{{ aap_backup_path }}/MANIFEST.txt"
    mode: '0600'

- name: Clean up old backups (retention policy)
  find:
    paths: "{{ backup_dir | default(aap_backup_dir) }}"
    age: "{{ retention_days | default(aap_backup_retention_days) }}d"
    file_type: directory
  register: old_backups

- name: Remove old backup directories
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ old_backups.files }}"
  when: old_backups.matched > 0

- name: Display backup completion status
  debug:
    msg: "Backup completed successfully! Location: {{ aap_backup_path }}"

- name: Upload backup to Azure Storage (optional)
  azure.azcollection.azure_rm_storageblob:
    resource_group: "{{ azure_resource_group | default('rg-ansible-automation-platform') }}"
    storage_account_name: "{{ azure_storage_account | default('aapbackups') }}"
    container: "{{ azure_container | default('aap-backups') }}"
    blob_type: block
    src: "{{ aap_backup_path }}/aap_config_backup.tar.gz"
    name: "aap-backup-{{ backup_date | default(ansible_date_time.iso8601_basic_short) }}.tar.gz"
  when: azure_backup_enabled | default(false)
  ignore_errors: true
