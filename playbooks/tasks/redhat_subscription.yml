---
# Register the host with the Red Hat Customer Portal and enable the AAP repository.
#
# Required variables: rh_username, rh_password
# Optional variables: aap_repo_version (defaults to aap_version from vars/aap_common.yml)

- name: Check system subscription status
  command: subscription-manager status
  register: sub_status
  failed_when: false
  changed_when: false

- name: Register with Red Hat Subscription Manager
  community.general.redhat_subscription:
    username: "{{ rh_username }}"
    password: "{{ rh_password }}"
    state: present
  when: "'Current' not in sub_status.stdout"
  register: reg_result
  until: reg_result is succeeded
  retries: 3
  delay: 10
  ignore_errors: true
  no_log: true

- name: Alert on registration failure
  debug:
    msg: "WARNING: Red Hat registration failed. Please check credentials and try again."
  when: reg_result is failed

- name: Fail on registration failure after retries
  assert:
    that:
      - reg_result is succeeded
    fail_msg: "Red Hat registration failed after 3 attempts. Please verify your credentials and network connectivity."
    quiet: true
  when: reg_result is failed

- name: Attach to standard subscriptions (auto-attach)
  command: subscription-manager attach --auto
  when: reg_result.changed
  register: attach_result
  failed_when: false

- name: Enable Ansible Automation Platform repositories
  command: "subscription-manager repos --enable={{ aap_repo_name }}"
  register: repo_result
  changed_when: "'is enabled' in repo_result.stdout or repo_result.rc == 0"
  ignore_errors: true

- name: Alert on repository enablement failure
  debug:
    msg: "WARNING: Failed to enable AAP repositories. This may be due to subscription issues."
  when: repo_result is failed

- name: Fail on repository enablement failure
  assert:
    that:
      - repo_result is succeeded
    fail_msg: "Failed to enable AAP repositories. Please check your subscription status and try again."
    quiet: true
  when: repo_result is failed
