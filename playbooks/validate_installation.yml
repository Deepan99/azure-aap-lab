---
- name: Validate AAP Installation and Configuration
  hosts: all
  become: true
  gather_facts: true

  vars:
    aap_url: "https://{{ ansible_default_ipv4.address | default(ansible_all_ipv4_addresses[0]) }}"

  tasks:
    # Individual checks are deliberately non-fatal so that a single failure does
    # not hide the state of the remaining checks. Every result is collected in
    # `validation_results` and the play fails at the end if any check reported
    # FAIL, so a failing validation can never look like a successful run.
    - name: Initialize validation results
      set_fact:
        validation_results: []

    - name: Test 1 - System Requirements Validation
      block:
        - name: Determine root filesystem free space
          set_fact:
            root_free_bytes: >-
              {{ ansible_mounts | selectattr('mount', 'equalto', '/')
                 | map(attribute='size_available') | first | default(0) | int }}

        - name: Record system requirements result
          set_fact:
            validation_results: "{{ validation_results + [{
              'test': 'System Requirements',
              'status': 'PASS' if (ansible_facts['processor_vcpus'] >= 4
                                   and ansible_facts['memtotal_mb'] >= 16384
                                   and root_free_bytes | int >= 50 * 1024 * 1024 * 1024) else 'FAIL',
              'details': 'CPU: ' + ansible_facts['processor_vcpus'] | string + ' cores, Memory: '
                         + (ansible_facts['memtotal_mb'] / 1024) | round(1) | string + 'GB, Free disk: '
                         + (root_free_bytes | int / 1024 / 1024 / 1024) | round(1) | string + 'GB'
              }] }}"

      rescue:
        - name: Record system requirements failure
          set_fact:
            validation_results: "{{ validation_results + [{
              'test': 'System Requirements',
              'status': 'FAIL',
              'details': 'Could not evaluate system requirements: '
                         + (ansible_failed_result.msg | default('unknown error')) | string
              }] }}"

    - name: Test 2 - Service Status Validation
      block:
        - name: Gather service facts
          service_facts:

        - name: Record service status result
          set_fact:
            validation_results: "{{ validation_results + [{
              'test': 'Service Status',
              'status': 'PASS' if (postgres_state == 'running' and awx_state == 'running') else 'FAIL',
              'details': 'PostgreSQL: ' + postgres_state + ', AAP: ' + awx_state
                         + ', receptor: ' + receptor_state
              }] }}"
          vars:
            postgres_state: "{{ ansible_facts.services['postgresql.service'].state | default('not installed') }}"
            awx_state: "{{ ansible_facts.services['awx.service'].state | default('not installed') }}"
            receptor_state: "{{ ansible_facts.services['receptor.service'].state | default('not installed') }}"

      rescue:
        - name: Record service status failure
          set_fact:
            validation_results: "{{ validation_results + [{
              'test': 'Service Status',
              'status': 'FAIL',
              'details': 'Could not read service state: '
                         + (ansible_failed_result.msg | default('unknown error')) | string
              }] }}"

    - name: Test 3 - Network Connectivity Validation
      block:
        - name: Check if AAP API is accessible
          uri:
            url: "{{ aap_url }}/api/v2/ping/"
            method: GET
            validate_certs: false
            return_content: true
          register: api_check
          failed_when: false

        - name: Check web interface accessibility
          uri:
            url: "{{ aap_url }}/"
            method: GET
            validate_certs: false
            return_content: true
          register: web_check
          failed_when: false

        - name: Record network connectivity result
          set_fact:
            validation_results: "{{ validation_results + [{
              'test': 'Network Connectivity',
              'status': 'PASS' if (api_status | int == 200 and web_status | int == 200) else 'FAIL',
              'details': 'API: ' + api_status | string + ', Web: ' + web_status | string
              }] }}"
          vars:
            api_status: "{{ api_check.status | default(0) | int }}"
            web_status: "{{ web_check.status | default(0) | int }}"

      rescue:
        - name: Record network connectivity failure
          set_fact:
            validation_results: "{{ validation_results + [{
              'test': 'Network Connectivity',
              'status': 'FAIL',
              'details': 'AAP services not accessible: '
                         + (ansible_failed_result.msg | default('unknown error')) | string
              }] }}"

    - name: Test 4 - Database Connectivity Validation
      block:
        - name: Check database tables
          command: psql -U awx -d awx -c "\dt"
          become: true
          become_user: awx
          register: table_check
          changed_when: false
          failed_when: false

        - name: Record database connectivity result
          set_fact:
            validation_results: "{{ validation_results + [{
              'test': 'Database Connectivity',
              'status': 'PASS' if table_check.rc == 0 else 'FAIL',
              'details': 'Database connection: ' + ('OK' if table_check.rc == 0
                         else 'FAILED (' + (table_check.stderr | default('') | trim) + ')')
              }] }}"

      rescue:
        - name: Record database connectivity failure
          set_fact:
            validation_results: "{{ validation_results + [{
              'test': 'Database Connectivity',
              'status': 'FAIL',
              'details': 'Cannot connect to AAP database: '
                         + (ansible_failed_result.msg | default('unknown error')) | string
              }] }}"

    - name: Test 5 - File System Validation
      block:
        - name: Check required AAP directories
          stat:
            path: "{{ item }}"
          register: directory_check
          loop:
            - /etc/tower
            - /var/lib/awx
            - /usr/share/ansible-automation-platform-installer

        - name: Record file system result
          set_fact:
            validation_results: "{{ validation_results + [{
              'test': 'File System',
              'status': 'PASS' if missing | length == 0 else 'FAIL',
              'details': 'Required directories: ' + ('present' if missing | length == 0
                         else 'missing ' + missing | join(', '))
              }] }}"
          vars:
            missing: "{{ directory_check.results | rejectattr('stat.exists') | map(attribute='item') | list }}"

      rescue:
        - name: Record file system failure
          set_fact:
            validation_results: "{{ validation_results + [{
              'test': 'File System',
              'status': 'FAIL',
              'details': 'Could not check required directories: '
                         + (ansible_failed_result.msg | default('unknown error')) | string
              }] }}"

    - name: Test 6 - AAP Version Validation
      block:
        - name: Get AAP version
          command: awx-manage --version
          register: version_check
          changed_when: false
          failed_when: false

        - name: Record version validation result
          set_fact:
            validation_results: "{{ validation_results + [{
              'test': 'AAP Version',
              'status': 'PASS' if version_check.rc == 0 else 'FAIL',
              'details': version_check.stdout | default('') | trim | default('Version check failed', true)
              }] }}"

      rescue:
        - name: Record version validation failure
          set_fact:
            validation_results: "{{ validation_results + [{
              'test': 'AAP Version',
              'status': 'FAIL',
              'details': 'Cannot determine AAP version: '
                         + (ansible_failed_result.msg | default('unknown error')) | string
              }] }}"

    - name: Test 7 - Authentication Validation
      block:
        - name: Test admin authentication
          uri:
            url: "{{ aap_url }}/api/v2/me/"
            method: GET
            user: "admin"
            password: "{{ vault_aap_admin_password | default(lookup('env', 'AAP_ADMIN_PASSWORD'), true) }}"
            validate_certs: false
            return_content: true
          register: auth_check
          no_log: true
          failed_when: false

        - name: Record authentication result
          set_fact:
            validation_results: "{{ validation_results + [{
              'test': 'Authentication',
              'status': 'PASS' if auth_status | int == 200 else 'FAIL',
              'details': 'Admin login: ' + ('success' if auth_status | int == 200
                         else 'failed (HTTP ' + auth_status | string + ')')
              }] }}"
          vars:
            auth_status: "{{ auth_check.status | default(0) | int }}"

      rescue:
        - name: Record authentication failure
          set_fact:
            validation_results: "{{ validation_results + [{
              'test': 'Authentication',
              'status': 'FAIL',
              'details': 'Admin authentication failed'
              }] }}"

    - name: Test 8 - Certificate Validation
      block:
        - name: Check SSL certificate
          command: openssl s_client -connect localhost:443 -showcerts
          args:
            stdin: ""
          register: cert_check
          changed_when: false
          failed_when: false

        - name: Record certificate result
          set_fact:
            validation_results: "{{ validation_results + [{
              'test': 'SSL Certificate',
              'status': 'PASS' if cert_check.rc == 0 else 'FAIL',
              'details': 'SSL certificate: ' + ('valid' if cert_check.rc == 0 else 'invalid')
              }] }}"

      rescue:
        - name: Record certificate failure
          set_fact:
            validation_results: "{{ validation_results + [{
              'test': 'SSL Certificate',
              'status': 'FAIL',
              'details': 'SSL certificate check failed'
              }] }}"

    - name: Test 9 - Log File Validation
      block:
        - name: Check AAP log files
          stat:
            path: /var/log/tower/tower.log
          register: log_check

        - name: Record log file result
          set_fact:
            validation_results: "{{ validation_results + [{
              'test': 'Log Files',
              'status': 'PASS' if log_check.stat.exists else 'FAIL',
              'details': 'Log files: ' + ('present' if log_check.stat.exists else 'missing')
              }] }}"

      rescue:
        - name: Record log file failure
          set_fact:
            validation_results: "{{ validation_results + [{
              'test': 'Log Files',
              'status': 'FAIL',
              'details': 'Log files not accessible'
              }] }}"

    - name: Test 10 - Backup Configuration Validation
      block:
        - name: Check backup directory
          stat:
            path: /opt/aap-backups
          register: backup_dir_check

        - name: Record backup configuration result
          set_fact:
            validation_results: "{{ validation_results + [{
              'test': 'Backup Configuration',
              'status': 'PASS' if backup_dir_check.stat.exists else 'WARN',
              'details': 'Backup directory: ' + ('configured' if backup_dir_check.stat.exists
                         else 'not configured')
              }] }}"

      rescue:
        - name: Record backup configuration warning
          set_fact:
            validation_results: "{{ validation_results + [{
              'test': 'Backup Configuration',
              'status': 'WARN',
              'details': 'Backup not configured'
              }] }}"

    # The overall status is derived from the collected results instead of a flag
    # that only the (rarely reached) rescue blocks used to set.
    - name: Determine overall validation status
      set_fact:
        validation_failed: "{{ validation_results | selectattr('status', 'equalto', 'FAIL') | list | length > 0 }}"

    - name: Generate validation report
      template:
        src: validation_report.j2
        dest: /tmp/aap_validation_report.txt
        mode: '0644'
      vars:
        report: "{{ validation_results }}"
        overall_status: "{{ 'FAIL' if validation_failed | bool else 'PASS' }}"

    - name: Display validation summary
      debug:
        msg: "{{ validation_results }}"

    - name: Fail if critical validations failed
      assert:
        that:
          - not validation_failed | bool
        success_msg: "Overall Validation Status: PASS (report: /tmp/aap_validation_report.txt)"
        fail_msg: |
          Overall Validation Status: FAIL - see /tmp/aap_validation_report.txt
          Failed checks:
          {% for result in validation_results | selectattr('status', 'equalto', 'FAIL') %}
          - {{ result.test }}: {{ result.details }}
          {% endfor %}
        quiet: true
