---
- name: Restore Ansible Automation Platform from Backup
  hosts: all
  become: true
  gather_facts: true

  vars:
    backup_dir: "/opt/aap-backups"
    backup_date: ""  # Specify backup date to restore (e.g., "20260814T120000")
    restore_method: "database"  # Options: database, config, full

  tasks:
    - name: Run restore tasks
      ansible.builtin.import_tasks: tasks/restore_aap.yml
