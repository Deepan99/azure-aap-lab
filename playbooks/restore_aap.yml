---
- name: Restore Ansible Automation Platform from Backup
  hosts: all
  become: true
  gather_facts: true

  vars:
    backup_dir: "/opt/aap-backups"
    backup_date: ""  # Specify backup date to restore (e.g., "20260814T120000")
    restore_method: "database"  # Options: database, config, full

  tasks:
    - name: Validate backup directory exists
      stat:
        path: "{{ backup_dir }}/{{ backup_date }}"
      register: backup_check
      failed_when: not backup_check.stat.exists

    - name: Display backup manifest
      slurp:
        src: "{{ backup_dir }}/{{ backup_date }}/MANIFEST.txt"
      register: manifest
      when: backup_check.stat.exists

    - name: Show backup information
      debug:
        msg: "{{ manifest.content | b64decode }}"

    - name: Confirm restore operation
      pause:
        prompt: "Are you sure you want to restore from {{ backup_date }}? This will overwrite current data. (yes/no)"
      register: confirm_restore

    - name: Stop AAP services before restore
      systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - awx
        - postgresql
      when: confirm_restore.user_input | bool

    - name: Restore PostgreSQL database
      postgresql_db:
        name: awx
        state: restore
        target: "{{ backup_dir }}/{{ backup_date }}/awx_db_backup.sql"
      become_user: awx
      when: 
        - confirm_restore.user_input | bool
        - restore_method in ['database', 'full']
      register: db_restore
      ignore_errors: true

    - name: Alert on database restore failure
      debug:
        msg: "WARNING: Database restore failed. Check backup file integrity and PostgreSQL status."
      when: 
        - confirm_restore.user_input | bool
        - db_restore is failed
        - restore_method in ['database', 'full']

    - name: Restore AAP configuration files
      unarchive:
        src: "{{ backup_dir }}/{{ backup_date }}/aap_config_backup.tar.gz"
        dest: /
        remote_src: true
      when: 
        - confirm_restore.user_input | bool
        - restore_method in ['config', 'full']

    - name: Restore custom EE images and projects
      unarchive:
        src: "{{ backup_dir }}/{{ backup_date }}/aap_custom_content.tar.gz"
        dest: /
        remote_src: true
      when: 
        - confirm_restore.user_input | bool
        - restore_method in ['config', 'full']

    - name: Restore AAP settings
      shell: |
        awx-manage import_settings {{ backup_dir }}/{{ backup_date }}/aap_settings.json
      args:
        chdir: /var/lib/awx
      changed_when: true
      when: 
        - confirm_restore.user_input | bool
        - restore_method in ['config', 'full']
      ignore_errors: true

    - name: Restart AAP services
      systemd:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - postgresql
        - awx
      when: confirm_restore.user_input | bool

    - name: Wait for AAP services to be ready
      uri:
        url: "https://{{ ansible_default_ipv4.address | default(ansible_all_ipv4_addresses[0]) }}/api/v2/ping/"
        method: GET
        validate_certs: false
        return_content: yes
      register: aap_ping
      until: aap_ping.status == 200
      retries: 30
      delay: 10
      timeout: 300
      when: confirm_restore.user_input | bool

    - name: Display restore completion status
      debug:
        msg: "Restore completed successfully from {{ backup_date }}! Please verify AAP functionality."
      when: confirm_restore.user_input | bool

    - name: Display cancellation message
      debug:
        msg: "Restore operation cancelled by user."
      when: not confirm_restore.user_input | bool