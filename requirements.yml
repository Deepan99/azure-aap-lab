---
# Pinned to known-good major versions so a new upstream major cannot silently
# change module behaviour. Install with:
#   ansible-galaxy collection install -r requirements.yml
collections:
  - name: azure.azcollection
    version: ">=3.21.0,<4.0.0"
  - name: community.general
    version: ">=13.3.0,<14.0.0"
  - name: community.postgresql
    version: ">=4.2.0,<5.0.0"
  - name: ansible.posix
    version: ">=2.2.2,<3.0.0"
