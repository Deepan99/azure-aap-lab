---
- name: Bootstrap RHEL 9 VM and Prepare Ansible Automation Platform (AAP) Installer
  hosts: all
  become: true
  gather_facts: true
  vars_prompt:
    - name: rh_username
      prompt: "Enter your Red Hat Customer Portal Username"
      private: false
    - name: rh_password
      prompt: "Enter your Red Hat Customer Portal Password"
      private: true
  vars_files:
    - ../playbooks/vars/aap_common.yml

  tasks:
    - name: Register system and enable AAP repositories
      include_tasks: ../playbooks/tasks/redhat_subscription.yml

    - name: Install system dependencies
      dnf:
        name: "{{ aap_system_packages }}"
        state: present
        update_cache: true

    - name: Install Ansible Automation Platform Installer package
      dnf:
        name: ansible-automation-platform-installer
        state: present

    # The inventory in this directory holds the AAP admin, database and registry
    # passwords, so it is restricted to its owner.
    - name: Ensure target directory exists for custom configuration
      file:
        path: "{{ aap_custom_inventory_dir }}"
        state: directory
        owner: "{{ ansible_user | default('azureuser') }}"
        group: "{{ ansible_user | default('azureuser') }}"
        mode: '0700'

    - name: Copy official installer template to working directory
      copy:
        src: "{{ aap_installer_dir }}/inventory"
        dest: "{{ aap_custom_inventory_dir }}/inventory"
        remote_src: true
        force: false
        owner: "{{ ansible_user | default('azureuser') }}"
        group: "{{ ansible_user | default('azureuser') }}"
        mode: '0600'

    - name: Notify user of next steps
      debug:
        msg: >
          Bootstrap complete!
          1. SSH into the VM: ssh {{ ansible_user }}@{{ ansible_host }}
          2. Edit the inventory file at '{{ aap_custom_inventory_dir }}/inventory' to set your admin, database, and hub passwords.
          3. Change directory: cd {{ aap_installer_dir }}
          4. Run the installer: sudo ./setup.sh -i {{ aap_custom_inventory_dir }}/inventory
