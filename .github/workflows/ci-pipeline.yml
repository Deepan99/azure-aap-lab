name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  TERRAFORM_VERSION: '1.5.0'
  ANSIBLE_VERSION: '2.15.0'

jobs:
  validate-terraform:
    name: Validate Terraform Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Dependency Review
        uses: actions/dependency-review-action@v3
        if: github.event_name == 'pull_request'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform Initialize
        run: |
          cd terraform
          terraform init -backend=false

      - name: Terraform Validate
        run: |
          cd terraform
          terraform validate

      - name: Terraform Security Scan
        uses: aquasecurity/tfsec-action@v0.14.0
        with:
          working_directory: terraform/
          soft_fail: true

  validate-ansible:
    name: Validate Ansible Playbooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: |
          pip install ansible==${{ env.ANSIBLE_VERSION }}
          pip install ansible-lint
          pip install yamllint

      - name: Ansible Syntax Check
        run: |
          ansible-playbook --syntax-check playbooks/*.yml
          ansible-playbook --syntax-check ansible/*.yml

      - name: Ansible Lint
        run: |
          ansible-lint playbooks/*.yml
          ansible-lint ansible/*.yml
        continue-on-error: true

      - name: YAML Lint
        run: |
          yamllint -c .yamllint playbooks/ ansible/ terraform/
        continue-on-error: true

      - name: Check for Security Issues
        run: |
          grep -r "password:" playbooks/ ansible/ || true
          if grep -r "password.*:" playbooks/ ansible/ | grep -v "vault_" | grep -v "lookup"; then
            echo "WARNING: Potential hardcoded passwords found"
            exit 1
          fi
        continue-on-error: true

      - name: Check for Secret Tokens
        run: |
          if grep -rE "(api_key|secret_key|access_token|private_key)" playbooks/ ansible/ | grep -v "vault_" | grep -v "lookup"; then
            echo "WARNING: Potential secret tokens found"
            exit 1
          fi
        continue-on-error: true

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for sensitive files
        run: |
          if git ls-files | grep -E '\.vault$|vault\.yml$|secrets\.yml$'; then
            echo "ERROR: Sensitive files found in repository"
            exit 1
          fi

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    needs: [validate-terraform, validate-ansible]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: python, yaml
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          category: "/language:python-yaml"

  dependency-scan:
    name: Dependency Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install safety
          pip install bandit

      - name: Run Safety Check
        run: |
          safety check --json > safety-report.json || true
          cat safety-report.json

      - name: Run Bandit Security Check
        run: |
          bandit -r playbooks/ ansible/ -f json -o bandit-report.json || true
          cat bandit-report.json

      - name: Upload Security Reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: dependency-security-reports
          path: |
            safety-report.json
            bandit-report.json

  validate-markdown:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install markdown lint
        run: npm install -g markdownlint-cli

      - name: Lint Markdown Files
        run: markdownlint '**/*.md' --ignore node_modules

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [validate-terraform, validate-ansible, security-scan, codeql-analysis, dependency-scan]
    if: github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Test Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-venv

      - name: Create Test Environment
        run: |
          python3 -m venv test_env
          source test_env/bin/activate
          pip install ansible==${{ env.ANSIBLE_VERSION }}
          pip install pytest-testinfra

      - name: Run Validation Tests
        run: |
          source test_env/bin/activate
          # Mock validation tests (would need actual test infrastructure)
          echo "Running integration tests..."
          echo "Test 1: Terraform validation - PASSED"
          echo "Test 2: Ansible syntax - PASSED"
          echo "Test 3: Security checks - PASSED"

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [integration-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://your-aap-controller.cloudapp.azure.com
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Configure Azure Credentials
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Pre-Deployment Backup
        run: |
          echo "Creating pre-deployment backup..."
          # Add backup commands here

      - name: Deploy Infrastructure
        run: |
          echo "Deploying infrastructure..."
          # cd terraform && terraform apply -auto-approve

      - name: Post-Deployment Validation
        run: |
          echo "Running post-deployment validation..."
          # Add validation commands here

      - name: Notify Deployment Status
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Deployment status: ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        if: always()