name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege default: jobs that need more (SARIF upload) opt in explicitly.
permissions:
  contents: read

env:
  TERRAFORM_VERSION: '1.9.8'
  # ansible 2.9 is end-of-life and unpatched; track a supported release train.
  ANSIBLE_VERSION: '11.9.0'

jobs:
  validate-terraform:
    name: Validate Terraform Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Requires the Dependency graph (and GHAS on private repos); it errors out
      # where that is unavailable, so it advises rather than gates.
      - name: Dependency Review
        uses: actions/dependency-review-action@v3
        if: github.event_name == 'pull_request'
        continue-on-error: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform Initialize
        run: |
          cd terraform
          terraform init -backend=false

      - name: Terraform Validate
        run: |
          cd terraform
          terraform validate

      # tfsec is deprecated and folded into Trivy; aquasecurity/tfsec-action has no
      # v1.28.1 tag, so this step could never resolve.
      - name: Terraform Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'terraform/'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

  validate-ansible:
    name: Validate Ansible Playbooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: |
          pip install ansible==${{ env.ANSIBLE_VERSION }}
          pip install ansible-lint
          pip install yamllint

      - name: Install Ansible Collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Ansible Syntax Check
        run: |
          for playbook in playbooks/*.yml; do
            if [[ "$playbook" != "playbooks/azure_dynamic_inventory.yml" ]]; then
              ansible-playbook --syntax-check "$playbook"
            fi
          done
          ansible-playbook --syntax-check ansible/*.yml

      - name: Ansible Lint
        run: |
          for playbook in playbooks/*.yml; do
            if [[ "$playbook" != "playbooks/azure_dynamic_inventory.yml" ]]; then
              ansible-lint "$playbook" || true
            fi
          done
          ansible-lint ansible/*.yml || true
        continue-on-error: true

      - name: YAML Lint
        run: |
          yamllint -c .yamllint playbooks/ ansible/ terraform/
        continue-on-error: true

      # These two checks gate the build: a hit means a credential may be about to
      # land in the repository, so they must not be allowed to soft-fail.
      - name: Check for Security Issues
        run: |
          if grep -rE "^[^#]*password[a-z_]*:\s*['\"]?[A-Za-z0-9!@#$%^&*_-]{6,}" playbooks/ ansible/ \
            | grep -v "vault_" | grep -v "lookup" | grep -v "{{" | grep -v "REPLACE_WITH"; then
            echo "ERROR: Potential hardcoded passwords found"
            exit 1
          fi

      - name: Check for Secret Tokens
        run: |
          if grep -rE "(api_key|secret_key|access_token|private_key)\s*[:=]\s*['\"]?[A-Za-z0-9/+_-]{16,}" playbooks/ ansible/ \
            | grep -v "vault_" | grep -v "lookup" | grep -v "{{"; then
            echo "ERROR: Potential secret tokens found"
            exit 1
          fi

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner
        # Pinned: '@master' runs unreviewed third-party code on every build.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for sensitive files
        run: |
          if git ls-files | grep -E '\.vault$|vault\.yml$|secrets\.yml$|\.tfstate|\.tfvars$|\.pem$|(^|/)id_rsa'; then
            echo "ERROR: Sensitive files found in repository"
            exit 1
          fi

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    needs: [validate-terraform, validate-ansible]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python, yaml
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python-yaml"

  dependency-scan:
    name: Dependency Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install safety
          pip install bandit

      - name: Run Safety Check
        run: |
          safety check --json > safety-report.json || true
          cat safety-report.json || true

      - name: Run Bandit Security Check
        run: |
          bandit -r playbooks/ ansible/ -f json -o bandit-report.json || true
          cat bandit-report.json || true

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-security-reports
          path: |
            safety-report.json
            bandit-report.json

  validate-markdown:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install markdown lint
        run: npm install -g markdownlint-cli

      - name: Lint Markdown Files
        run: markdownlint '**/*.md' --ignore node_modules
        continue-on-error: true

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [validate-terraform, validate-ansible, security-scan, codeql-analysis, dependency-scan]
    if: github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Test Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-venv
        continue-on-error: true

      - name: Create Test Environment
        run: |
          python3 -m venv test_env
          source test_env/bin/activate
          pip install ansible==${{ env.ANSIBLE_VERSION }}
          pip install pytest-testinfra
        continue-on-error: true

      - name: Run Validation Tests
        run: |
          source test_env/bin/activate
          # Mock validation tests (would need actual test infrastructure)
          echo "Running integration tests..."
          echo "Test 1: Terraform validation - PASSED"
          echo "Test 2: Ansible syntax - PASSED"
          echo "Test 3: Security checks - PASSED"
        continue-on-error: true

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [integration-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://your-aap-controller.cloudapp.azure.com
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Configure Azure Credentials
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Pre-Deployment Backup
        run: |
          echo "Creating pre-deployment backup..."
          # Add backup commands here

      - name: Deploy Infrastructure
        run: |
          echo "Deploying infrastructure..."
          # cd terraform && terraform apply -auto-approve

      - name: Post-Deployment Validation
        run: |
          echo "Running post-deployment validation..."
          # Add validation commands here

      - name: Notify Deployment Status
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Deployment status: ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
