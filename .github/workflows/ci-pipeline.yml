name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  TERRAFORM_VERSION: '1.5.0'
  # ansible-core version; ansible-lint and the collections used by the
  # playbooks require a supported release.
  ANSIBLE_VERSION: '2.16.14'

jobs:
  validate-terraform:
    name: Validate Terraform Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Dependency Review
        uses: actions/dependency-review-action@v3
        if: github.event_name == 'pull_request'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform Initialize
        run: |
          cd terraform
          terraform init -backend=false

      - name: Terraform Validate
        run: |
          cd terraform
          terraform validate

      - name: Terraform Security Scan
        uses: aquasecurity/tfsec-action@v1.28.1
        with:
          working_directory: terraform/
          soft_fail: true

  validate-ansible:
    name: Validate Ansible Playbooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: |
          set -euo pipefail
          pip install "ansible-core==${{ env.ANSIBLE_VERSION }}" ansible-lint yamllint

      - name: Install Ansible Collections
        run: ansible-galaxy collection install -r collections/requirements.yml

      - name: Ansible Syntax Check
        run: |
          set -euo pipefail
          for playbook in playbooks/*.yml; do
            if [[ "$playbook" != "playbooks/azure_dynamic_inventory.yml" ]]; then
              ansible-playbook --syntax-check "$playbook"
            fi
          done
          ansible-playbook --syntax-check ansible/*.yml

      - name: Ansible Lint
        run: ansible-lint playbooks/ ansible/

      - name: YAML Lint
        run: yamllint -c .yamllint playbooks/ ansible/ terraform/ .github/

      - name: Check for Hardcoded Credentials
        run: ./scripts/check_hardcoded_secrets.sh playbooks ansible

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for sensitive files
        run: |
          if git ls-files | grep -E '\.vault$|vault\.yml$|secrets\.yml$'; then
            echo "ERROR: Sensitive files found in repository"
            exit 1
          fi

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    needs: [validate-terraform, validate-ansible]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python, yaml
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python-yaml"

  dependency-scan:
    name: Dependency Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install safety
          pip install bandit

      # These scanners exit non-zero when they find issues, which must fail the
      # job; only a missing report (tool crash) is reported separately so the
      # upload step below still has something to attach.
      - name: Run Safety Check
        run: |
          set -o pipefail
          if ! safety check --json --output safety-report.json; then
            if [[ -s safety-report.json ]]; then
              echo "::error::safety reported vulnerable dependencies, see the uploaded report"
              exit 1
            fi
            echo "::warning::safety could not produce a report (see log above)"
          fi

      - name: Run Bandit Security Check
        run: bandit -r playbooks/ ansible/ -f json -o bandit-report.json

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-security-reports
          path: |
            safety-report.json
            bandit-report.json

  validate-markdown:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install markdown lint
        run: npm install -g markdownlint-cli

      - name: Lint Markdown Files
        run: markdownlint '**/*.md' --ignore node_modules

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [validate-terraform, validate-ansible, security-scan, codeql-analysis, dependency-scan]
    if: github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Test Environment
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-venv

      - name: Create Test Environment
        run: |
          set -euo pipefail
          python3 -m venv test_env
          source test_env/bin/activate
          pip install "ansible-core==${{ env.ANSIBLE_VERSION }}" pytest-testinfra
          ansible-galaxy collection install -r collections/requirements.yml

      # Real checks only: a step that prints "PASSED" unconditionally hides
      # regressions, so the playbooks are actually parsed here.
      - name: Run Validation Tests
        run: |
          set -euo pipefail
          source test_env/bin/activate
          for playbook in playbooks/*.yml; do
            if [[ "$playbook" != "playbooks/azure_dynamic_inventory.yml" ]]; then
              ansible-playbook --syntax-check "$playbook"
            fi
          done
          ansible-playbook --syntax-check ansible/*.yml

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [integration-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://your-aap-controller.cloudapp.azure.com
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Configure Azure Credentials
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Pre-Deployment Backup
        run: |
          echo "Creating pre-deployment backup..."
          # Add backup commands here

      - name: Deploy Infrastructure
        run: |
          echo "Deploying infrastructure..."
          # cd terraform && terraform apply -auto-approve

      - name: Post-Deployment Validation
        run: |
          echo "Running post-deployment validation..."
          # Add validation commands here

      - name: Notify Deployment Status
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Deployment status: ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
